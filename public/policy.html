<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iScholar - Privacy Policy & Terms of Service</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <div class="container-fluid">
        <button onclick="window.history.back()" class="btn btn-link text-decoration-none d-flex align-items-center gap-1 p-0">
            <i class="fas fa-chevron-left"></i>
            <span>Back</span>
        </button>
        <span class="navbar-brand mb-0 h5 ms-3">iScholar</span>
    </div>
</nav>

<div class="container">
    <div class="header">
        <h1>🎓 iScholar</h1>
        <p>An Intelligent Scholarship Prequalification System</p>
    </div>

    <div class="tab-buttons">
        <button class="tab-btn active" onclick="showTab('privacy')">Privacy Policy</button>
        <button class="tab-btn" onclick="showTab('terms')">Terms of Service</button>
    </div>

    <div class="content">
        <!-- PRIVACY POLICY -->


        <!-- TERMS OF SERVICE -->
        <div id="terms" class="tab-content">

        </div>
    </div>

    <div class="footer">
        <p>&copy; 2025 iScholar - An Intelligent Scholarship Prequalification System</p>
        <p>All Rights Reserved | Compliant with Philippine Data Privacy Act of 2012 (RA 10173)</p>
        <p style="margin-top: 10px;">Last Updated: October 2, 2025</p>
    </div>
</div>

<script>
    function showTab(tabName) {
        // Hide all tab contents
        const contents = document.querySelectorAll('.tab-content');
        contents.forEach(content => content.classList.remove('active'));

        // Remove active class from all buttons
        const buttons = document.querySelectorAll('.tab-btn');
        buttons.forEach(btn => btn.classList.remove('active'));

        // Show selected tab content
        document.getElementById(tabName).classList.add('active');

        // Add active class to clicked button
        event.target.classList.add('active');

        // Scroll to top
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
</body>
</html>
